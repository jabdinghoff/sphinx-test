name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build HTML
        run: uv run --group docs sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Reports only; deploy does not depend on these, so a warning never blocks the site.
  sphinx-warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build HTML with warnings as errors
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

  editor-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/editor-format
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/editor-format/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: tools/editor-format/package.json
          cache: pnpm
          cache-dependency-path: tools/editor-format/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Pages are in the form the Pages CMS editor saves
        run: pnpm check
